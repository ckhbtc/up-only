<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/uponlylogo.png" />
    <title>UpOnly</title>
    <script>
      // Set theme BEFORE first paint to avoid FOUC.
      // Order: localStorage > 'bauhaus' default.
      // Migrate legacy values: old 'dark' (Atrium) → 'bauhaus-dark'; 'light' (Hearth) → 'bauhaus'.
      (function () {
        try {
          var saved = localStorage.getItem('up-only-theme');
          if (saved === 'dark') saved = 'bauhaus-dark';
          if (saved === 'light') saved = 'bauhaus';
          var t = (saved === 'bauhaus' || saved === 'bauhaus-dark') ? saved : 'bauhaus';
          document.documentElement.dataset.theme = t;
          if (t !== localStorage.getItem('up-only-theme')) {
            localStorage.setItem('up-only-theme', t);
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'bauhaus';
        }
      })();
    </script>
    <style>
      html { background: #f3ffd7; color: #101014; }
      html[data-theme="bauhaus-dark"] { background: #0f160e; color: #101014; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
